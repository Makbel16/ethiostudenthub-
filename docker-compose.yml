version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: esh
      POSTGRES_PASSWORD: esh_password
      POSTGRES_DB: ethiostudenthub
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://esh:esh_password@postgres:5432/ethiostudenthub?schema=public
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://backend:5000
      VITE_ALLOWED_HOSTS: .ngrok-free.dev,.ngrok-free.app,.ngrok.app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
